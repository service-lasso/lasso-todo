name: Todo service package verification
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run package
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lasso-todo-${{ runner.os }}
          path: |
            dist/*
            output/package-verification.json
          if-no-files-found: error
