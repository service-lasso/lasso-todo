name: Development service candidate
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified development service candidate
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  package-consumer:
    if: github.ref == 'refs/heads/develop'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run package
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lasso-todo-${{ runner.os }}
          path: |
            dist/*
            output/package-verification.json
          if-no-files-found: error
  publish:
    needs: package-consumer
    if: github.ref == 'refs/heads/develop' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: development-service
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: lasso-todo-*
          path: release-assets
          merge-multiple: true
      - name: Bind source, manifest and asset inventory
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(date -u +%Y.%-m.%-d)-${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          export RELEASE_VERSION="$version"
          node - <<'NODE'
          const fs = require('node:fs'); const manifest = require('./service.json');
          manifest.version = process.env.RELEASE_VERSION;
          manifest.artifact.source.version = process.env.RELEASE_VERSION;
          fs.writeFileSync('release-assets/service.json', JSON.stringify(manifest, null, 2) + '\n');
          fs.writeFileSync('release-assets/source.json', JSON.stringify({ sourceSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, kind: 'development-service-candidate' }) + '\n');
          NODE
          cd release-assets
          sha256sum lasso-todo-win32.zip lasso-todo-linux.tar.gz lasso-todo-darwin.tar.gz service.json source.json > SHA256SUMS.txt
      - name: Publish qualified development candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$RELEASE_VERSION" --target "$GITHUB_SHA" --prerelease --title "$RELEASE_VERSION" --notes "Development tutorial service candidate; no GA declaration. Source $GITHUB_SHA; workflow $GITHUB_RUN_ID." release-assets/lasso-todo-win32.zip release-assets/lasso-todo-linux.tar.gz release-assets/lasso-todo-darwin.tar.gz release-assets/service.json release-assets/source.json release-assets/SHA256SUMS.txt
